name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provision:
    name: Provisioning script (shellcheck + fake-adb tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x provision/capitv-provision.sh provision/tests/test-provision.sh provision/tests/fake-adb
      - name: Provisioning tests
        run: provision/tests/test-provision.sh

  launcher:
    name: Launcher (build, unit tests, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    env:
      CAPITV_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "CAPITV_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CAPITV_VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Release keystore (from repository secrets, if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPITV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/capitv-release.jks"
            echo "CAPITV_KEYSTORE_FILE=$RUNNER_TEMP/capitv-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the CapITV release key from secrets."
          else
            echo "::warning::CAPITV_KEYSTORE_BASE64 not set: the APK is signed with a throwaway debug key (see docs/SIGNING.md)."
          fi
      - name: Build, test, lint
        env:
          CAPITV_KEYSTORE_PASSWORD: ${{ secrets.CAPITV_KEYSTORE_PASSWORD }}
          CAPITV_KEY_ALIAS: ${{ secrets.CAPITV_KEY_ALIAS }}
          CAPITV_KEY_PASSWORD: ${{ secrets.CAPITV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
      - name: Check the APK has no INTERNET permission
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee /tmp/perms.txt
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then
            echo "::error::CapITV must not request INTERNET"; exit 1
          fi
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/capitv-${CAPITV_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/capitv.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: capitv-apk
          path: launcher/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            launcher/app/build/reports/
            launcher/app/build/test-results/
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [provision, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: capitv-apk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "CapITV $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            || gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
